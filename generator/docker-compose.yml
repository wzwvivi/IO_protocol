version: '3.8'

services:
  arinc429-generator:
    build: .
    container_name: arinc429-generator
    ports:
      - "5001:5000"
    volumes:
      # 将输出目录映射到本地，方便获取生成的文件
      - ./output:/app/output
      # 将数据目录映射到本地，持久化用户修改
      - ./data:/app/data
      # Git 仓库目录（协议版本存储）
      - ./git_repos:/app/git_repos
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # LLM API 配置（用于协议文件自动解析功能）
      - LLM_API_BASE_URL=https://api.openai.com/v1
      - LLM_MODEL=gpt-5.4
      - LLM_TIMEOUT=180
    # 添加 DNS 配置解决域名解析问题
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 114.114.114.114
    network_mode: bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s